<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Cartoon Car</title>
    
    
    <style>
        
        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        
        .title {
            color: #b91e1e;
            font-family: sans-serif;
        }

       
        .car {
            position: relative;
            width: 200px;
            height: 100px;
            background-color: red;
            border-radius: 20px; 
            margin-bottom: 30px;
        }

        
        .car .eye {
            position: absolute;
            top: 20px;
            right: 30px;
            width: 30px;
            height: 30px;
            background-color: white;
            border-radius: 50%; 
        }

        
        .eye .pupil {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 15px;
            height: 15px;
            background-color: black;
            border-radius: 50%;
        }

        
        .smile {
            position: absolute;
            bottom: 20px;
            right: 15px;
            width: 30px;
            height: 15px;
            border-bottom: 5px solid black;
            border-radius: 0 0 30px 30px; 
        }

        
        .wheel {
            position: absolute;
            bottom: -15px;
            width: 40px;
            height: 40px;
            background-color: black;
            border-radius: 50%;
        }

       
        .left-wheel { left: 25px; }
        .right-wheel { right: 25px; }
    </style>
</head>
<body>

   
    <h1 id="title">Beep Beep!</h1>

   
    <div class="car">
        
        
        <div class="eye">
            <div class="pupil"></div>
        </div>
        <div class="smile"></div>

        
        <div class="wheel left-wheel"></div>
        <div class="wheel right-wheel"></div>

    </div>

   
    <p style="color: rgb(142, 157, 241); font-family: sans-serif;">My simple CSS character.</p>

</body>
</html>
